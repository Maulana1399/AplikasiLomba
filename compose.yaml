# ---------------------------------------------------------------
# Stack Docker "AplikasiLomba" — terisolasi dari aplikasi lain di VM.
#
# Port host: 8083 (via MATCH_HTTP_PORT env var).
# Data SQLite + storage Laravel dipakai melalui named volume.
# ---------------------------------------------------------------
name: match

services:
  match-app:
    build:
      context: .
      target: prod
      network: host
    container_name: match-app
    restart: unless-stopped
    working_dir: /var/www/match
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://127.0.0.1:8083}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/match/database/database.sqlite
    volumes:
      - match-db:/var/www/match/database
      - match-storage:/var/www/match/storage
      - match-bootstrap-cache:/var/www/match/bootstrap/cache
    expose:
      - "9000"
    networks:
      - match-network
    healthcheck:
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "127.0.0.1:9000", "/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  match-web:
    image: nginx:1.27-alpine
    container_name: match-web
    restart: unless-stopped
    depends_on:
      match-app:
        condition: service_healthy
    ports:
      - "${MATCH_HTTP_PORT:-8083}:80"
    volumes:
      - ./:/var/www/match:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - match-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Tools profile — untuk menjalankan artisan/test di dalam container.
  #   docker compose --profile tools run --rm match-tools php artisan test
  match-tools:
    build:
      context: .
      target: base
      network: host
    profiles: ["tools"]
    container_name: match-tools
    working_dir: /var/www/match
    env_file:
      - .env.docker
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    volumes:
      - ./database/migrations:/var/www/match/database/migrations:ro
      - match-storage:/var/www/match/storage
      - match-tools-bootstrap-cache:/var/www/match/bootstrap/cache
    networks:
      - match-network

networks:
  match-network:
    driver: bridge

volumes:
  match-db:
  match-storage:
  match-bootstrap-cache:
  match-tools-bootstrap-cache:
