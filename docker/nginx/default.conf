# Nginx reverse-proxy internal AplikasiLomba
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/match/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 24M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Healthcheck dari nginx container
    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass match-app:9000;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /flux/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass match-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|map|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
